<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#141029"/></linearGradient><linearGradient id="curveGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur2" stdDeviation="16"/><feMerge><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.45;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes badgePulse{0%{filter:drop-shadow(0 0 6px rgba(56,189,248,.4))}50%{filter:drop-shadow(0 0 16px rgba(236,72,153,.7))}}.pulsing-glow{transform-origin:950px 180px;animation:pulseGlow 4s ease-in-out infinite}.growth-path{stroke-dasharray:8 6;animation:dashMove 2.5s linear infinite}.node-anim-1{animation:floatNode 3s ease-in-out infinite}.node-anim-2{animation:floatNode 3s ease-in-out 1.5s infinite}.main-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text,.chip-text,.subtitle{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,