<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#141029" />
    </linearGradient>

    <!-- Animated Glow Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes badgePulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(236, 72, 153, 0.7)); }
    }
    .pulsing-glow {
      transform-origin: 950px 180px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .growth-path {
      stroke-dasharray: 8 6;
      animation: dashMove 2.5s linear infinite;
    }
    .node-anim-1 {
      animation: floatNode 3s ease-in-out infinite;
    }
    .node-anim-2 {
      animation: floatNode 3s ease-in-out 1.5s infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="180" r="140" fill="#4f46e5" opacity="0.25" filter="url(#softGlow)" class="pulsing-glow" />
  <circle cx="1060" cy="120" r="90" fill="#ec4899" opacity="0.2" filter="url(#softGlow)" />
  <circle cx="180" cy="280" r="110" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)" />

  <!-- Dynamic Expansion Revenue Curve -->
  <path d="M 680 340 C 800 330, 860 260, 940 190 C 990 145, 1050 90, 1140 75" 
        fill="none" stroke="url(#curveGrad)" stroke-width="5" filter="url(#glow)" />
  <path d="M 680 340 C 800 330, 860 260, 940 190 C 990 145, 1050 90, 1140 75" 
        fill="none" stroke="#ffffff" stroke-width="2" class="growth-path" />

  <!-- Shaded Area Under Curve -->
  <path d="M 680 340 C 800 330, 860 260, 940 190 C 990 145, 1050 90, 1140 75 L 1140 370 L 680 370 Z" 
        fill="url(#accentGrad)" opacity="0.08" />

  <!-- Floating Metric Nodes along Curve -->
  <g class="node-anim-1">
    <circle cx="940" cy="190" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="940" cy="190" r="4" fill="#ffffff" />
    <rect x="880" y="135" width="120" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <text x="940" y="157" text-anchor="middle" class="chip-text" fill="#38bdf8" font-size="12">🚀 +135% NRR</text>
  </g>

  <g class="node-anim-2">
    <circle cx="1140" cy="75" r="10" fill="#ec4899" filter="url(#glow)" />
    <circle cx="1140" cy="75" r="5" fill="#ffffff" />
    <rect x="1055" y="20" width="125" height="34" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
    <text x="1117" y="42" text-anchor="middle" class="chip-text" fill="#ec4899" font-size="12">💎 Expansion</text>
  </g>

  <!-- Left Content / Branding Header -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 60)">
    <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="badge-text">REVENUE EXPANSION PLATFORM</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="145" class="main-title">
    Awesome <tspan fill="url(#curveGrad)">Revenue Expansion</tspan>
  </text>
  <text x="80" y="195" class="main-title">
    Platform Ecosystem ⚡
  </text>

  <!-- Subtitle -->
  <text x="80" y="240" class="subtitle">
    Customer Success • Health Scoring • Churn Prevention • Account Growth
  </text>

  <!-- Feature Chips / Badges Row -->
  <g transform="translate(80, 280)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="80" y="24" text-anchor="middle" class="chip-text">📊 CS &amp; Health Scoring</text>

    <!-- Chip 2 -->
    <rect x="175" y="0" width="165" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="257" y="24" text-anchor="middle" class="chip-text">🛡️ Churn Prevention</text>

    <!-- Chip 3 -->
    <rect x="355" y="0" width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="445" y="24" text-anchor="middle" class="chip-text">📈 Upsell &amp; NRR Growth</text>
  </g>
</svg>